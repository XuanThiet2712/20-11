<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri Ân Cô Thanh Hải 20/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Saira+Stencil+One&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: một màn hình duy nhất, bảng chỉ huy quân sự: logo trên cùng, lời chúc gõ từng chữ bên trái, radar sao vàng bên phải. */
:root {
  --bg: #070d09;
  --line: #28422d;
  --olive: #8fae5a;
  --khaki: #d8e0b8;
  --gold: #f5c542;
  --red: #d6283b;
  --mute: #9aab94;
  --f-display: "Saira Stencil One", "Saira Condensed", Impact, sans-serif;
  --f-cond: "Saira Condensed", "Arial Narrow", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); }
body {
  color: var(--khaki); font-family: var(--f-body); line-height: 1.6; overflow-x: hidden;
  background:
    radial-gradient(900px 520px at 88% 0%, rgba(95,127,58,.24), transparent 60%),
    radial-gradient(700px 500px at -5% 85%, rgba(214,40,59,.12), transparent 60%),
    var(--bg);
}
#rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .35; pointer-events: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }
.grid-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: linear-gradient(rgba(143,174,90,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(143,174,90,.06) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 55% 45%, #000 15%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 55% 45%, #000 15%, transparent 75%);
}

.stage { position: relative; z-index: 1; min-height: 100%; min-height: 100dvh; max-width: 1180px; margin: 0 auto; padding: 18px 24px 22px;
  display: grid; grid-template-rows: auto 1fr auto; gap: 8px; }

/* Đầu trang */
.hud { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.logo-badge { background: #fff; border-radius: 10px; padding: 5px 9px; line-height: 0; box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(245,197,66,.25); }
.logo-badge img { height: clamp(40px, 7vh, 58px); width: auto; display: block; }
.brand-text { font-family: var(--f-cond); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; line-height: 1.3; }
.brand-text b { display: block; color: var(--gold); font-weight: 700; font-size: 18px; }

/* Nội dung chính */
.main { display: grid; grid-template-columns: 1.3fr .7fr; gap: 32px; align-items: center; min-height: 0; }
.copy { min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: clamp(11px, 1.7vh, 13px); color: var(--olive); letter-spacing: .06em; margin-bottom: 8px; min-height: 1.6em; }
h1 { font-family: var(--f-display); font-weight: 400; line-height: 1; letter-spacing: .01em; }
h1 .big { display: block; font-size: clamp(52px, min(12vw, 18vh), 132px); color: var(--gold); text-shadow: 0 0 40px rgba(245,197,66,.3); }
h1 .name { display: block; font-size: clamp(24px, min(5vw, 6.4vh), 52px); color: var(--khaki); margin-top: 8px; }
.msg { margin-top: clamp(12px, 2.4vh, 24px); max-width: 52ch; font-size: clamp(14px, 2.2vh, 18px); color: var(--khaki); }
.sig { margin-top: clamp(10px, 2vh, 18px); font-family: var(--f-cond); font-weight: 700; font-size: clamp(15px, 2.4vh, 20px); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }

/* Gõ chữ: phần chưa gõ vẫn giữ chỗ nên bố cục không nhảy */
.u { visibility: hidden; }
.cursor { display: inline-block; width: 0; position: relative; }
.cursor::after { content: ""; position: absolute; left: 2px; bottom: .12em; width: .5em; height: 1em; background: var(--gold); animation: blink 1s steps(1) infinite; }
.sig .cursor::after { height: .9em; }

/* Radar */
.radar-wrap { display: grid; place-items: center; }
.radar { position: relative; width: min(100%, 46vh, 360px); aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--olive);
  background: repeating-radial-gradient(circle at center, transparent 0 11%, rgba(143,174,90,.28) 11% 11.4%), radial-gradient(circle, rgba(95,127,58,.22), rgba(7,13,9,.9) 70%);
  box-shadow: 0 0 50px rgba(95,127,58,.28), inset 0 0 40px rgba(0,0,0,.6); overflow: hidden; }
.radar::before, .radar::after { content: ""; position: absolute; background: rgba(143,174,90,.35); }
.radar::before { left: 50%; top: 0; width: 1px; height: 100%; }
.radar::after { top: 50%; left: 0; height: 1px; width: 100%; }
.sweep { position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(245,197,66,0) 0deg, rgba(245,197,66,0) 280deg, rgba(245,197,66,.45) 358deg, rgba(245,197,66,.9) 360deg);
  animation: spin 4.5s linear infinite; }
.star { position: absolute; left: 50%; top: 50%; width: 36%; aspect-ratio: 1; transform: translate(-50%,-50%); z-index: 2; background: var(--red); border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 30px rgba(214,40,59,.55); }
.star i { display: block; width: 74%; aspect-ratio: 1; background: var(--gold); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.blip { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #5ee07a; box-shadow: 0 0 10px #5ee07a; animation: ping 2.4s infinite; z-index: 1; }
.blip:nth-of-type(1) { left: 22%; top: 28%; }
.blip:nth-of-type(2) { left: 72%; top: 38%; animation-delay: .8s; }
.blip:nth-of-type(3) { left: 60%; top: 76%; animation-delay: 1.5s; }
.blip:nth-of-type(4) { left: 28%; top: 68%; animation-delay: 2s; }

/* Nút */
.foot { display: flex; justify-content: center; padding-top: 6px; min-height: 64px; }
.btn { font-family: var(--f-display); font-size: clamp(16px, 3.4vh, 24px); letter-spacing: .06em; color: #1a1300; background: var(--gold); border: 0; padding: 13px 30px; cursor: pointer;
  clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .8s, transform .8s, filter .15s; }
.btn.show { opacity: 1; transform: none; pointer-events: auto; }
.btn.show:hover { filter: brightness(1.1); transform: translateY(-2px); }
.btn:focus-visible { outline: 3px solid var(--khaki); outline-offset: 4px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes ping { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1.5); opacity: 1; } }

@media (max-width: 820px) {
  .stage { padding: 14px 18px 16px; }
  .main { grid-template-columns: 1fr; gap: 12px; align-content: center; }
  .radar-wrap { order: -1; }
  .radar { width: min(30vh, 56vw); }
  .brand-text { font-size: 12px; }
  .brand-text b { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #rain { display: none; }
}
</style>
</head>

  </header>

  <main class="main">
    <div class="copy">
      <div class="eyebrow" data-type="> 20.11 | NGÀY NHÀ GIÁO VIỆT NAM" data-speed="34"></div>
      <h1>
        <span class="big" data-type="TRI ÂN" data-speed="130"></span>
        <span class="name" data-type="Cô Nguyễn Thị Thanh Hải" data-speed="65"></span>
      </h1>
      <p class="msg" data-type="Nhân ngày Nhà giáo Việt Nam, tập thể lớp CNTT.C kính chúc cô luôn mạnh khỏe, hạnh phúc và thành công. Cảm ơn cô đã giữ vững kỷ luật, truyền lửa tri thức và đồng hành cùng chúng em." data-speed="30"></p>
      <div class="sig" data-type="Tập thể lớp CNTT.C" data-speed="60"></div>
    </div>
    <div class="radar-wrap">
      <div class="radar" role="img" aria-label="Radar quét với ngôi sao vàng giữa nền đỏ">
        <div class="sweep"></div>
        <span class="blip"></span><span class="blip"></span><span class="blip"></span><span class="blip"></span>
        <div class="star"><i></i></div>
      </div>
    </div>
  </main>

  <div class="foot"><button class="btn" id="send" type="button">GỬI LỜI TRI ÂN</button></div>
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Mưa mã nhị phân (mờ, làm nền)
  var rain = document.getElementById("rain"), rc = rain.getContext("2d");
  var cols, drops, fs = 16, chars = "01{}<>/;=+#CNTT".split("");
  function sizeRain() {
    rain.width = window.innerWidth; rain.height = window.innerHeight;
    cols = Math.ceil(rain.width / fs); drops = [];
    for (var i = 0; i < cols; i++) drops[i] = Math.random() * -50;
  }
  function drawRain() {
    rc.fillStyle = "rgba(7,13,9,0.12)"; rc.fillRect(0, 0, rain.width, rain.height);
    rc.font = fs + "px JetBrains Mono, monospace";
    for (var i = 0; i < cols; i++) {
      rc.fillStyle = Math.random() > 0.985 ? "#f5c542" : "rgba(143,174,90,0.55)";
      rc.fillText(chars[(Math.random() * chars.length) | 0], i * fs, drops[i] * fs);
      if (drops[i] * fs > rain.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 0.5;
    }
  }
  sizeRain(); window.addEventListener("resize", sizeRain);
  if (!reduce) setInterval(drawRain, 60);

  // Pháo hoa
  var fx = document.getElementById("fx"), fc = fx.getContext("2d"), parts = [], running = false;
  function sizeFx() { fx.width = window.innerWidth; fx.height = window.innerHeight; }
  sizeFx(); window.addEventListener("resize", sizeFx);
  var colors = ["#f5c542", "#d6283b", "#8fae5a", "#ffffff", "#5ee07a"];
  function burst(x, y) {
    for (var i = 0; i < 70; i++) {
      var a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: colors[(Math.random() * colors.length) | 0], r: 1.5 + Math.random() * 2 });
    }
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  function loop() {
    fc.clearRect(0, 0, fx.width, fx.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.07; p.vx *= 0.99; p.life -= 0.013;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      fc.globalAlpha = p.life; fc.fillStyle = p.c;
      fc.beginPath(); fc.arc(p.x, p.y, p.r, 0, 6.2832); fc.fill();
    }
    fc.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(loop); else running = false;
  }
  var btn = document.getElementById("send");
  btn.addEventListener("click", function () {
    var w = window.innerWidth, h = window.innerHeight;
    for (var i = 0; i < 5; i++) {
      (function (k) { setTimeout(function () { burst(w * (0.12 + Math.random() * 0.76), h * (0.12 + Math.random() * 0.5)); }, k * 200); })(i);
    }
  });

  // Hiệu ứng gõ chữ từng ký tự
  var els = Array.prototype.slice.call(document.querySelectorAll("[data-type]"));
  var cursor = document.createElement("span"); cursor.className = "cursor"; cursor.setAttribute("aria-hidden", "true");
  els.forEach(function (el) {
    var txt = el.getAttribute("data-type");
    el.setAttribute("aria-label", txt);
    el.innerHTML = '<span class="t" aria-hidden="true"></span><span class="u" aria-hidden="true"></span>';
    el.querySelector(".u").textContent = txt;
  });

  function typeEl(el, done) {
    var t = el.querySelector(".t"), u = el.querySelector(".u");
    var txt = el.getAttribute("data-type"), speed = +el.getAttribute("data-speed") || 40, i = 0;
    el.insertBefore(cursor, u);
    (function step() {
      i++;
      t.textContent = txt.slice(0, i); u.textContent = txt.slice(i);
      if (i < txt.length) setTimeout(step, speed + (/[,.]/.test(txt.charAt(i - 1)) ? 220 : 0));
      else setTimeout(done, 380);
    })();
  }
  function showAll() {
    els.forEach(function (el) { el.querySelector(".t").textContent = el.getAttribute("data-type"); el.querySelector(".u").textContent = ""; });
    btn.classList.add("show");
  }
  function run(n) {
    if (n >= els.length) { btn.classList.add("show"); return; }
    typeEl(els[n], function () { run(n + 1); });
  }
  if (reduce) showAll();
  else {
    var started = false;
    var go = function () { if (!started) { started = true; setTimeout(function () { run(0); }, 500); } };
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(go); setTimeout(go, 1500); } else go();
  }
})();
</script>
